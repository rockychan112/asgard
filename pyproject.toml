[project]
name = "asgard"
version = "0.0.1"
description = "Your private intelligence officer. It refracts the same news into the stakes and actions that are yours alone."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
fetch = ["readability-lxml>=0.8", "lxml>=5.0"]
mcp = [
    "mcp>=2.0",
]

[project.scripts]
asgard = "asgard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asgard"]

# the demo personas and news fixtures live inside the package so a plain
# `pip install` / `uvx` install can run `brief fixture:...` and list the demo
# identities — outside it they simply would not ship
[tool.setuptools.package-data]
asgard = ["personas/*.yaml", "fixtures/*.json"]
